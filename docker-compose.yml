version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetos-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - DATABASE_URL=sqlite:////app/fleetos_pulse.db
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://127.0.0.1:5173
    volumes:
      - backend-data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./fleetos-pulse
      dockerfile: Dockerfile
    container_name: fleetos-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
